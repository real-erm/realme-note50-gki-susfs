name: Build Realme Note 50 GKI 2.0 (SUSFS + SELinux Enforcing)

on:
  workflow_dispatch:
    inputs:
      kernel_tag:
        description: 'Android Common Kernel Tag or Branch (e.g. android13-5.15.178_r00)'
        required: true
        type: string
        default: 'android13-5.15.178_r00'
      kernel_release_suffix:
        description: 'Kernel release vermagic suffix (matches Realme Note 50 stock modules)'
        required: false
        type: string
        default: '-android13-8-g0ff3dab2ed1b-ab36'
      android_version:
        description: 'Android Version'
        required: true
        type: choice
        options:
          - android13
          - android14
        default: android13
      kernel_version:
        description: 'Kernel Version'
        required: true
        type: choice
        options:
          - '5.15'
        default: '5.15'
      root_flavor:
        description: 'Root Provider'
        required: true
        type: choice
        options:
          - KernelSU
          - KernelSU-Next
        default: KernelSU
      ksu_branch:
        description: 'KernelSU / KernelSU-Next Branch or Tag (leave blank for latest stable)'
        required: false
        type: string
        default: ''
      enable_susfs:
        description: 'Enable SUSFS (root hiding & mount evasion)'
        required: true
        type: boolean
        default: true
      susfs_branch:
        description: 'SUSFS Branch in susfs4ksu repository'
        required: true
        type: string
        default: 'gki-android13-5.15'
      spoof_stock_config:
        description: 'Spoof /proc/config.gz with Realme Note 50 stock config'
        required: true
        type: boolean
        default: true
      create_release:
        description: 'Create GitHub Release with compiled binaries'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

jobs:
  build-kernel:
    name: Build GKI Kernel (${{ inputs.kernel_tag }})
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout Builder Repository
        uses: actions/checkout@v4

      - name: Maximize Runner Disk Space
        run: |
          echo "[*] Cleaning preinstalled toolchains and runtimes to maximize disk space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/aws-cli /opt/hostedtoolcache
          sudo docker image prune -a -f || true
          df -h

      - name: Setup Swap Space (16 GB for Thin-LTO)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev \
            libgmp-dev libmpc-dev libmpfr-dev libssl-dev libelf-dev libncurses-dev \
            python3 python3-pip python3-setuptools bc rsync jq libxml2-utils tar

          # Install Google repo tool
          mkdir -p ~/.bin
          curl -sSL https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Initialize and Sync GKI Kernel Source
        run: |
          mkdir -p kernel
          cd kernel

          # Configure git identity for repo tool
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global color.ui false

          MANIFEST_BRANCH="common-${{ inputs.android_version }}-${{ inputs.kernel_version }}"
          echo "[*] Initializing repo with branch: $MANIFEST_BRANCH"
          repo init -u https://android.googlesource.com/kernel/manifest -b "$MANIFEST_BRANCH" --depth=1

          DEFAULT_MANIFEST_PATH=".repo/manifests/default.xml"
          if [ -f "$DEFAULT_MANIFEST_PATH" ]; then
            # Strip virtual-device and tests to avoid unnecessary emulator modules and tag mismatch failures
            echo "[*] Stripping unneeded virtual-device and test modules from manifest..."
            sed -i '/common-modules\/virtual-device/d' "$DEFAULT_MANIFEST_PATH"
            sed -i '/kernel\/tests/d' "$DEFAULT_MANIFEST_PATH"

            if [ -n "${{ inputs.kernel_tag }}" ]; then
              echo "[*] Pinning common project in manifest to: refs/tags/${{ inputs.kernel_tag }}"
              sed -i "/path=\"common\"/ s|revision=\"[^\"]*\"|revision=\"refs/tags/${{ inputs.kernel_tag }}\"|" "$DEFAULT_MANIFEST_PATH"
            fi
          fi

          echo "[*] Syncing kernel sources..."
          repo sync -c -j$(nproc) --force-sync --no-tags --no-clone-bundle

          cd common
          if [ -n "${{ inputs.kernel_tag }}" ]; then
            echo "[*] Verifying checkout matches tag: ${{ inputs.kernel_tag }}..."
            git checkout -f "refs/tags/${{ inputs.kernel_tag }}" 2>/dev/null || \
            git checkout -f "${{ inputs.kernel_tag }}" 2>/dev/null || \
            echo "[!] Maintaining current branch tip commit"
          fi
          echo "[+] Verified kernel commit: $(git log -1 --oneline)"

      - name: Integrate Root Provider (${{ inputs.root_flavor }})
        run: |
          cd kernel
          if [ "${{ inputs.root_flavor }}" = "KernelSU-Next" ]; then
            echo "[*] Installing KernelSU-Next..."
            KSU_ARG="${{ inputs.ksu_branch }}"
            [ -z "$KSU_ARG" ] && KSU_ARG="next"
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s "$KSU_ARG"
          else
            echo "[*] Installing official KernelSU..."
            KSU_ARG="${{ inputs.ksu_branch }}"
            [ -z "$KSU_ARG" ] && KSU_ARG="main"
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s "$KSU_ARG"
          fi

      - name: Apply SUSFS Patches & Integrate Core Files
        if: ${{ inputs.enable_susfs }}
        run: |
          cd kernel
          echo "[*] Cloning susfs4ksu (branch: ${{ inputs.susfs_branch }})..."
          git clone --depth=1 -b "${{ inputs.susfs_branch }}" https://gitlab.com/simonpunk/susfs4ksu.git ../susfs_src

          TARGET_KSU_DIR="KernelSU"
          if [ ! -d "KernelSU" ] && [ -d "KernelSU-Next" ]; then
            TARGET_KSU_DIR="KernelSU-Next"
          fi
          echo "[*] Root provider directory: $TARGET_KSU_DIR"

          echo "[*] Patching $TARGET_KSU_DIR for SUSFS..."
          if [ -f ../susfs_src/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ]; then
            cp ../susfs_src/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch "$TARGET_KSU_DIR/"
            cd "$TARGET_KSU_DIR"
            patch -p1 --forward < 10_enable_susfs_for_ksu.patch || echo "[!] Notice: Some KernelSU patch hunks already present or skipped"
            cd ..
          fi

          echo "[*] Copying SUSFS kernel files into common/..."
          cp -r ../susfs_src/kernel_patches/fs/* common/fs/
          cp -r ../susfs_src/kernel_patches/include/linux/* common/include/linux/

          echo "[*] Applying SUSFS kernel patch..."
          SUSFS_PATCH="../susfs_src/kernel_patches/50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch"
          if [ -f "$SUSFS_PATCH" ]; then
            cp "$SUSFS_PATCH" common/
            cd common
            patch -p1 --forward < "$(basename "$SUSFS_PATCH")" || echo "[!] Notice: Handling any version-specific hunk rejects below..."
            cd ..
          else
            echo "[!] SUSFS patch $SUSFS_PATCH not found; checking alternatives..."
            ALT_PATCH=$(find ../susfs_src/kernel_patches -name "50_add_susfs*.patch" | head -n 1)
            if [ -n "$ALT_PATCH" ]; then
              cp "$ALT_PATCH" common/
              cd common
              patch -p1 --forward < "$(basename "$ALT_PATCH")" || true
              cd ..
            fi
          fi

          echo "[*] Resolving any patch rejects for 5.15 sublevel differences..."
          cd common
          # 1. fs/namespace.c reject fix (due to missing trace/hooks/blk.h in older 5.15 builds)
          if ! grep -q "susfs_def.h" fs/namespace.c; then
            echo "[*] Injecting SUSFS definitions into fs/namespace.c..."
            sed -i '/#include "internal.h"/a #ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs_def.h>\n#endif\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\nextern bool susfs_is_current_ksu_domain(void);\nextern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\n#define CL_COPY_MNT_NS BIT(25)\n#endif' fs/namespace.c
          fi

          # 2. fs/proc/task_mmu.c reject fix (due to missing trace/hooks/mm.h in older 5.15 builds)
          if ! grep -q "susfs_def.h" fs/proc/task_mmu.c; then
            echo "[*] Injecting SUSFS definitions into fs/proc/task_mmu.c..."
            sed -i '/#include <linux\/pkeys.h>/a #if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n#include <linux/susfs_def.h>\n#endif' fs/proc/task_mmu.c
          fi

          rm -f fs/namespace.c.rej fs/proc/task_mmu.c.rej
          cd ..

      - name: Configure Kernel Options (SUSFS + SELinux Enforcing + Stock Config Spoof)
        run: |
          cd kernel/common
          DEFCONFIG="arch/arm64/configs/gki_defconfig"

          echo "[*] Injecting KSU and SUSFS configuration flags..."
          {
            echo ""
            echo "# KernelSU Configuration"
            echo "CONFIG_KSU=y"
            echo ""
            echo "# SUSFS Configuration"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y"
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            echo "CONFIG_KSU_SUSFS_SUS_SU=y"
            echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y"
          } >> "$DEFCONFIG"

          echo "[*] Enforcing strict SELinux in defconfig..."
          # Guarantee SELinux is compiled in and defaults to Enforcing
          sed -i 's/^# CONFIG_SECURITY_SELINUX is not set/CONFIG_SECURITY_SELINUX=y/' "$DEFCONFIG"
          grep -q "^CONFIG_SECURITY_SELINUX=y" "$DEFCONFIG" || echo "CONFIG_SECURITY_SELINUX=y" >> "$DEFCONFIG"
          grep -q "^CONFIG_DEFAULT_SECURITY_SELINUX=y" "$DEFCONFIG" || echo "CONFIG_DEFAULT_SECURITY_SELINUX=y" >> "$DEFCONFIG"

          # Ensure SELinux boot disable is NOT enabled
          sed -i 's/^CONFIG_SECURITY_SELINUX_DISABLE=y/# CONFIG_SECURITY_SELINUX_DISABLE is not set/' "$DEFCONFIG"
          sed -i 's/^CONFIG_SECURITY_SELINUX_BOOTPARAM=y/# CONFIG_SECURITY_SELINUX_BOOTPARAM is not set/' "$DEFCONFIG"

          if [ "${{ inputs.spoof_stock_config }}" = "true" ] && [ -f "${{ github.workspace }}/config/stock_defconfig" ]; then
            echo "[*] Installing Realme Note 50 stock config to spoof /proc/config.gz..."
            cp "${{ github.workspace }}/config/stock_defconfig" arch/arm64/configs/stock_defconfig
            sed -i 's|$(obj)/config_data: $(KCONFIG_CONFIG) FORCE|$(obj)/config_data: arch/arm64/configs/stock_defconfig FORCE|' kernel/Makefile
            echo "[+] kernel/Makefile successfully patched to spoof /proc/config.gz"
          fi

          echo "[*] Cleaning kernel banner strings..."
          # Strip '-dirty' suffix from kernel release
          sed -i "s/printf '%s' -dirty/printf '%s' ''/g" scripts/setlocalversion

          # Match stock compile host/user from Realme Note 50 banner
          sed -i '/UTS_VERSION=/a LINUX_COMPILE_BY=build-user\nLINUX_COMPILE_HOST=build-host' scripts/mkcompile_h

          # Set vermagic release suffix if specified to match stock vendor modules exactly
          if [ -n "${{ inputs.kernel_release_suffix }}" ]; then
            SUFFIX="${{ inputs.kernel_release_suffix }}"
            [[ "$SUFFIX" != -* ]] && SUFFIX="-$SUFFIX"
            echo "[*] Setting fixed kernel release suffix: $SUFFIX"
            sed -i "s|echo \"\$res\"|echo \"$SUFFIX\"|g" scripts/setlocalversion
          fi

          # Disable defconfig check and ABI protected exports enforcement
          cd ..
          sed -i 's/check_defconfig//' common/build.config.gki || true
          rm -f common/android/abi_gki_protected_exports_*

      - name: Compile GKI Kernel
        run: |
          cd kernel

          echo "[*] Starting kernel build via build/build.sh..."
          BUILD_GKI_ARTIFACTS="" \
          BUILD_GKI_CERTIFICATION_TOOLS=0 \
          BUILD_SYSTEM_DLKM=0 \
          SKIP_VENDOR_BOOT=1 \
          SKIP_EXT_MODULES=1 \
          SKIP_CP_KERNEL_HDR=1 \
          OUT_DIR="/home/runner/out" \
          LTO=thin \
          BUILD_CONFIG=common/build.config.gki.aarch64 \
          build/build.sh -j"$(nproc)"

      - name: Verify Kernel Image and SELinux
        run: |
          IMAGE_PATH=""
          if [ -f "/home/runner/out/dist/Image" ]; then
            IMAGE_PATH="/home/runner/out/dist/Image"
          elif [ -f "kernel/bazel-bin/common/kernel_aarch64/Image" ]; then
            IMAGE_PATH="kernel/bazel-bin/common/kernel_aarch64/Image"
          fi

          if [ -z "$IMAGE_PATH" ]; then
            echo "::error::Compiled Image not found in output directory!"
            exit 1
          fi

          echo "[+] Kernel Image successfully built at $IMAGE_PATH ($(ls -lh "$IMAGE_PATH" | awk '{print $5}'))"

          # Check SUSFS strings in compiled Image
          SUSFS_COUNT=$(strings "$IMAGE_PATH" | grep -ic "susfs" || true)
          echo "[+] SUSFS string occurrences in Image: $SUSFS_COUNT"
          if [ "${{ inputs.enable_susfs }}" = "true" ] && [ "$SUSFS_COUNT" -eq 0 ]; then
            echo "::warning::SUSFS strings not detected in compiled Image. Check patch application."
          fi

          # Verify SELinux configuration in compiled .config
          CONFIG_PATH="/home/runner/out/.config"
          if [ -f "$CONFIG_PATH" ]; then
            echo "[*] Verifying SELinux configs in $CONFIG_PATH:"
            grep -E "CONFIG_SECURITY_SELINUX|CONFIG_DEFAULT_SECURITY_SELINUX|CONFIG_KSU" "$CONFIG_PATH" || true
          fi

          echo "BUILT_IMAGE=$IMAGE_PATH" >> $GITHUB_ENV

      - name: Build Userspace SUSFS Tool & Module
        if: ${{ inputs.enable_susfs }}
        run: |
          mkdir -p artifacts/tools
          if [ -d "susfs_src/ksu_module_susfs/tools" ]; then
            echo "[*] Copying prebuilt ksu_susfs userspace binaries..."
            cp -r susfs_src/ksu_module_susfs/tools/* artifacts/tools/ || true
          fi

          if [ -d "susfs_src/ksu_module_susfs" ]; then
            echo "[*] Packaging susfs4ksu Magisk/KSU module..."
            cd susfs_src/ksu_module_susfs
            zip -r "${{ github.workspace }}/artifacts/susfs4ksu-module.zip" ./* -x ".git*"
            cd "${{ github.workspace }}"
          fi

      - name: Package Boot Image & AnyKernel3
        run: |
          mkdir -p artifacts

          # 1. Copy raw Image
          cp "$BUILT_IMAGE" artifacts/Image

          # 2. Package boot.img (Header Version 4, Realme Note 50 layout)
          echo "[*] Generating boot.img with header version 4..."
          export PYTHONPATH="${{ github.workspace }}/tools/mkbootimg"
          python3 "${{ github.workspace }}/tools/mkbootimg/mkbootimg" \
            --header_version 4 \
            --kernel "$BUILT_IMAGE" \
            -o artifacts/boot.img
          echo "[+] Generated artifacts/boot.img ($(ls -lh artifacts/boot.img | awk '{print $5}'))"

          # 3. Package AnyKernel3 flashable zip
          echo "[*] Creating AnyKernel3 flashable zip..."
          cp "$BUILT_IMAGE" tools/AnyKernel3/Image
          cd tools/AnyKernel3
          zip -r9 "${{ github.workspace }}/artifacts/AnyKernel3-Realme-Note50-GKI2.0-SUSFS.zip" * -x "*.git*" "README.md"
          cd "${{ github.workspace }}"
          echo "[+] Generated AnyKernel3 zip"

          # 4. Generate MD5 and SHA256 checksums
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          md5sum * > MD5SUMS.txt
          cd ..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Realme-Note-50-GKI2.0-${{ inputs.kernel_tag }}-SUSFS
          path: artifacts/*

      - name: Create GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.kernel_tag }}-${{ inputs.root_flavor }}-SUSFS
          name: "Realme Note 50 GKI 2.0 Kernel (${{ inputs.kernel_tag }}) with SUSFS & Enforcing SELinux"
          body: |
            ### Realme Note 50 (UMS9230 / Unisoc T612) GKI 2.0 Custom Kernel
            
            Compiled from Google Android Common Kernel source tree with **${{ inputs.root_flavor }}** and **SUSFS**.
            
            #### Build Highlights:
            - **Target Kernel**: `${{ inputs.kernel_tag }}` (Linux LTS 5.15)
            - **Root Provider**: `${{ inputs.root_flavor }}`
            - **Root Hiding**: SUSFS (Stack-Unaware File System) patches integrated
            - **SELinux Status**: **Strictly Enforcing** (`CONFIG_SECURITY_SELINUX=y`, `CONFIG_DEFAULT_SECURITY_SELINUX=y`, full AVC & status spoofing)
            - **Stock Config Spoofed**: `/proc/config.gz` reports the stock Realme Note 50 configuration to hide custom kernel flags
            - **Cleaner Banner & Vermagic**: `-dirty` suffix stripped, compile host aligned with stock build banner (`${{ inputs.kernel_release_suffix }}`)
            
            #### Flashing Instructions:
            
            **Method A — Fastboot (Recommended)**:
            ```bash
            # Flash directly to boot partition
            fastboot flash boot boot.img
            
            # If flashing to a specific slot:
            fastboot flash boot_a boot.img
            fastboot reboot
            ```
            
            > **Note on AVB**: If your device requires AVB verification disabled:
            > `fastboot --disable-verity --disable-verification flash vbmeta vbmeta_a.img`
            
            **Method B — AnyKernel3 Recovery / Manager Flash**:
            Flash `AnyKernel3-Realme-Note50-GKI2.0-SUSFS.zip` in custom recovery (TWRP/OrangeFox) or via your root manager.
            
            #### Post-Install:
            1. Install the latest **${{ inputs.root_flavor }} Manager APK**.
            2. In Manager, flash `susfs4ksu-module.zip` to install the userspace hide daemon and `ksu_susfs` command line tool.
          files: |
            artifacts/*
