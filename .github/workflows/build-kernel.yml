name: Build Realme Note 50 GKI 2.0 (SUSFS + Enforcing & Permissive)

on:
  workflow_dispatch:
    inputs:
      kernel_tag:
        description: 'Android Common Kernel Tag or Branch (e.g. android13-5.15.178_r00)'
        required: true
        type: string
        default: 'android13-5.15.178_r00'
      kernel_release_suffix:
        description: 'Kernel release vermagic suffix (matches Realme Note 50 stock modules)'
        required: false
        type: string
        default: '-android13-8-g0ff3dab2ed1b-ab36'
      android_version:
        description: 'Android Version'
        required: true
        type: choice
        options:
          - android13
          - android14
        default: android13
      kernel_version:
        description: 'Kernel Version'
        required: true
        type: choice
        options:
          - '5.15'
        default: '5.15'
      root_flavor:
        description: 'Root Provider'
        required: true
        type: choice
        options:
          - SukiSU-Ultra
          - KernelSU
          - KernelSU-Next
        default: SukiSU-Ultra
      ksu_branch:
        description: 'Root Provider Branch or Tag (defaults: builtin for SukiSU-Ultra, main for KernelSU, next for KernelSU-Next)'
        required: false
        type: string
        default: ''
      enable_susfs:
        description: 'Enable SUSFS (root hiding & mount evasion)'
        required: true
        type: boolean
        default: true
      susfs_branch:
        description: 'SUSFS Branch in susfs4ksu repository'
        required: true
        type: string
        default: 'gki-android13-5.15'
      spoof_stock_config:
        description: 'Spoof /proc/config.gz with Realme Note 50 stock config'
        required: true
        type: boolean
        default: true
      create_release:
        description: 'Create GitHub Release with compiled binaries'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

jobs:
  build-kernel:
    name: Build GKI Kernel (${{ inputs.kernel_tag }})
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout Builder Repository
        uses: actions/checkout@v4

      - name: Maximize Runner Disk Space
        run: |
          echo "[*] Cleaning preinstalled toolchains and runtimes to maximize disk space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/aws-cli /opt/hostedtoolcache
          sudo docker image prune -a -f || true
          df -h

      - name: Setup Swap Space (16 GB for Thin-LTO)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev \
            libgmp-dev libmpc-dev libmpfr-dev libssl-dev libelf-dev libncurses-dev \
            python3 python3-pip python3-setuptools bc rsync jq libxml2-utils tar

          # Install Google repo tool
          mkdir -p ~/.bin
          curl -sSL https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Initialize and Sync GKI Kernel Source
        run: |
          mkdir -p kernel
          cd kernel

          # Configure git identity for repo tool
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global color.ui false

          MANIFEST_BRANCH="common-${{ inputs.android_version }}-${{ inputs.kernel_version }}"
          echo "[*] Initializing repo with branch: $MANIFEST_BRANCH"
          repo init -u https://android.googlesource.com/kernel/manifest -b "$MANIFEST_BRANCH" --depth=1

          DEFAULT_MANIFEST_PATH=".repo/manifests/default.xml"
          if [ -f "$DEFAULT_MANIFEST_PATH" ]; then
            echo "[*] Stripping unneeded virtual-device and test modules from manifest..."
            sed -i '/common-modules\/virtual-device/d' "$DEFAULT_MANIFEST_PATH"
            sed -i '/kernel\/tests/d' "$DEFAULT_MANIFEST_PATH"

            if [ -n "${{ inputs.kernel_tag }}" ]; then
              echo "[*] Pinning common project in manifest to: refs/tags/${{ inputs.kernel_tag }}"
              sed -i "/path=\"common\"/ s|revision=\"[^\"]*\"|revision=\"refs/tags/${{ inputs.kernel_tag }}\"|" "$DEFAULT_MANIFEST_PATH"
            fi
          fi

          echo "[*] Syncing kernel sources..."
          repo sync -c -j$(nproc) --force-sync --no-tags --no-clone-bundle

          cd common
          if [ -n "${{ inputs.kernel_tag }}" ]; then
            echo "[*] Verifying checkout matches tag: ${{ inputs.kernel_tag }}..."
            git checkout -f "refs/tags/${{ inputs.kernel_tag }}" 2>/dev/null || \
            git checkout -f "${{ inputs.kernel_tag }}" 2>/dev/null || \
            echo "[!] Maintaining current branch tip commit"
          fi
          echo "[+] Verified kernel commit: $(git log -1 --oneline)"

      - name: Integrate Root Provider (${{ inputs.root_flavor }})
        run: |
          cd kernel
          if [ "${{ inputs.root_flavor }}" = "SukiSU-Ultra" ]; then
            echo "[*] Installing SukiSU-Ultra (targeting builtin branch)..."
            KSU_ARG="${{ inputs.ksu_branch }}"
            [ -z "$KSU_ARG" ] && KSU_ARG="builtin"
            curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/builtin/kernel/setup.sh" | bash -s "$KSU_ARG"
          elif [ "${{ inputs.root_flavor }}" = "KernelSU-Next" ]; then
            echo "[*] Installing KernelSU-Next..."
            KSU_ARG="${{ inputs.ksu_branch }}"
            [ -z "$KSU_ARG" ] && KSU_ARG="next"
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s "$KSU_ARG"
          else
            echo "[*] Installing official KernelSU..."
            KSU_ARG="${{ inputs.ksu_branch }}"
            [ -z "$KSU_ARG" ] && KSU_ARG="main"
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s "$KSU_ARG"
          fi

          echo "[*] Patching KSU SELinux rules, selinux_hide, and mount_hide..."
          python3 -c '
          import glob

          # 1. Add custom GSI SELinux domains (magisk, su) after backup_sepolicy is snapshotted,
          #    and enable selinux_hide by default once backup_sepolicy is ready.
          for rf in glob.glob("**/selinux/rules.c", recursive=True):
              with open(rf, "r") as f:
                  content = f.read()
              gsi_block = """
              /* Custom GSI compatibility domains (hidden from apps via backup_sepolicy) */
              ksu_type(db, "magisk", "domain");
              ksu_permissive(db, "magisk");
              ksu_typeattribute(db, "magisk", "mlstrustedsubject");
              ksu_allow(db, "magisk", ALL, ALL, ALL);
              ksu_allow(db, "init", "magisk", ALL, ALL);

              ksu_type(db, "su", "domain");
              ksu_permissive(db, "su");
              ksu_typeattribute(db, "su", "mlstrustedsubject");
              ksu_allow(db, "su", ALL, ALL, ALL);
              ksu_allow(db, "init", "su", ALL, ALL);
          """
              if "ksu_permissive(db, \"magisk\");" not in content:
                  target = "ksu_allow(db, \"system_server\", KERNEL_SU_DOMAIN, \"process\", \"sigkill\");"
                  if target in content:
                      content = content.replace(target, target + "\n" + gsi_block, 1)
                      print(f"[+] Injected custom GSI SELinux domains into {rf}")
              if "extern bool ksu_selinux_hide_enabled;" not in content and "backup_sepolicy success!" in content:
                  content = "extern bool ksu_selinux_hide_enabled;\nextern bool ksu_selinux_hide_running;\n" + content
                  btarget = "pr_info(\"backup sepolicy success! latest_granting=%d\\n\", backup_sepolicy->latest_granting);"
                  content = content.replace(
                      btarget,
                      btarget + "\n                ksu_selinux_hide_enabled = true;\n                ksu_selinux_hide_running = true;",
                      1,
                  )
                  print(f"[+] Enabled selinux_hide by default after backup_sepolicy creation in {rf}")
              with open(rf, "w") as f:
                  f.write(content)

          # 2. Sanitize selinux_hide.c to prevent kernel panics on unhandled CEXPR
          for sh in glob.glob("**/selinux_hide.c", recursive=True):
              with open(sh, "r") as f:
                  c = f.read()
              c = c.replace("BUG();", "return 0;")
              c = c.replace("BUG_ON(!source);", "if (!source) return;")
              c = c.replace("BUG_ON(!target);", "if (!target) return;")
              c = c.replace("BUG_ON(sp != 0);", "if (sp != 0) return 0;")
              with open(sh, "w") as f:
                  f.write(c)
              print(f"[+] Sanitized {sh} (removed raw BUG calls)")

          # 3. Disable SukiSU-Ultra -ENOENT mount_hide hook (which breaks /proc/self/mountinfo in Momo)
          #    because SUSFS susfs_show_mountinfo already filters KSU mounts cleanly in seq_file.
          for mh in glob.glob("**/mount_hide.c", recursive=True):
              with open(mh, "r") as f:
                  c = f.read()
              c = c.replace(
                  "static bool ksu_mount_hide_enabled __read_mostly = true;",
                  "static bool ksu_mount_hide_enabled __read_mostly = false;",
              )
              c = c.replace("return -ENOENT;", "return 0;")
              with open(mh, "w") as f:
                  f.write(c)
              print(f"[+] Disabled -ENOENT mount_hide in {mh} in favor of SUSFS mount filtering")
          '

      - name: Apply SUSFS Patches & Integrate Core Files
        if: ${{ inputs.enable_susfs }}
        run: |
          cd kernel
          echo "[*] Cloning susfs4ksu (branch: ${{ inputs.susfs_branch }})..."
          git clone --depth=1 -b "${{ inputs.susfs_branch }}" https://gitlab.com/simonpunk/susfs4ksu.git ../susfs_src

          TARGET_KSU_DIR="KernelSU"
          if [ ! -d "KernelSU" ] && [ -d "KernelSU-Next" ]; then
            TARGET_KSU_DIR="KernelSU-Next"
          fi
          echo "[*] Root provider directory: $TARGET_KSU_DIR"

          if [ "${{ inputs.root_flavor }}" != "SukiSU-Ultra" ]; then
            echo "[*] Patching $TARGET_KSU_DIR for SUSFS..."
            if [ -f ../susfs_src/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ]; then
              cp ../susfs_src/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch "$TARGET_KSU_DIR/"
              cd "$TARGET_KSU_DIR"
              patch -p1 --forward < 10_enable_susfs_for_ksu.patch || echo "[!] Notice: Some KernelSU patch hunks already present or skipped"
              rm -f 10_enable_susfs_for_ksu.patch
              cd ..
            fi
          else
            echo "[*] SukiSU-Ultra builtin branch already includes SUSFS inline hooks; skipping 10_enable_susfs_for_ksu.patch"
          fi

          echo "[*] Copying SUSFS kernel files into common/..."
          cp -r ../susfs_src/kernel_patches/fs/* common/fs/
          cp -r ../susfs_src/kernel_patches/include/linux/* common/include/linux/

          echo "[*] Configuring SUSFS defaults in common/fs/susfs.c (disable dmesg log, enable mount & AVC hiding at boot)..."
          python3 -c '
          p = "common/fs/susfs.c"
          with open(p, "r") as f:
              c = f.read()
          c = c.replace(
              "DEFINE_STATIC_KEY_TRUE(susfs_is_log_enabled);",
              "DEFINE_STATIC_KEY_FALSE(susfs_is_log_enabled);",
          )
          c = c.replace("pr_info(\"susfs: disable logging to kernel\");", "")
          init_target = "INIT_WORK(&susfs_extra_works, susfs_run_extra_works);"
          init_inject = (
              init_target
              + "\n\tstatic_branch_enable(&susfs_is_hide_sus_mnts_for_non_su_procs_enabled);"
              + "\n\tstatic_branch_enable(&susfs_is_avc_log_spoofing_enabled);"
          )
          if init_target in c:
              c = c.replace(init_target, init_inject, 1)
          with open(p, "w") as f:
              f.write(c)
          print("[+] Patched common/fs/susfs.c successfully")
          '

          echo "[*] Applying SUSFS kernel patch..."
          SUSFS_PATCH="../susfs_src/kernel_patches/50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch"
          if [ -f "$SUSFS_PATCH" ]; then
            PATCH_BASENAME="$(basename "$SUSFS_PATCH")"
            cp "$SUSFS_PATCH" common/
            cd common
            patch -p1 --forward < "$PATCH_BASENAME" || echo "[!] Notice: Handling any version-specific hunk rejects below..."
            rm -f "$PATCH_BASENAME"
            cd ..
          else
            echo "[!] SUSFS patch $SUSFS_PATCH not found; checking alternatives..."
            ALT_PATCH=$(find ../susfs_src/kernel_patches -name "50_add_susfs*.patch" | head -n 1)
            if [ -n "$ALT_PATCH" ]; then
              PATCH_BASENAME="$(basename "$ALT_PATCH")"
              cp "$ALT_PATCH" common/
              cd common
              patch -p1 --forward < "$PATCH_BASENAME" || true
              rm -f "$PATCH_BASENAME"
              cd ..
            fi
          fi

          echo "[*] Resolving any patch rejects for 5.15 sublevel differences..."
          cd common
          if ! grep -q "susfs_def.h" fs/namespace.c; then
            echo "[*] Injecting SUSFS definitions into fs/namespace.c..."
            sed -i '/#include "internal.h"/a #ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs_def.h>\n#endif\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\nextern bool susfs_is_current_ksu_domain(void);\nextern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\n#define CL_COPY_MNT_NS BIT(25)\n#endif' fs/namespace.c
          fi

          if ! grep -q "susfs_def.h" fs/proc/task_mmu.c; then
            echo "[*] Injecting SUSFS definitions into fs/proc/task_mmu.c..."
            sed -i '/#include <linux\/pkeys.h>/a #if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n#include <linux/susfs_def.h>\n#endif' fs/proc/task_mmu.c
          fi

          rm -f fs/namespace.c.rej fs/proc/task_mmu.c.rej

          REMAINING_REJ=$(find . -name "*.rej")
          if [ -n "$REMAINING_REJ" ]; then
            echo "::error::Unhandled patch rejects found in kernel source:"
            echo "$REMAINING_REJ"
            exit 1
          fi

          echo "[*] Patching fs/proc/cmdline.c and SELinux dual-mode tag (Enforcing & Permissive boot images)..."
          python3 - << 'PYEOF'
          cmdline_code = """// SPDX-License-Identifier: GPL-2.0
          #include <linux/fs.h>
          #include <linux/init.h>
          #include <linux/proc_fs.h>
          #include <linux/seq_file.h>
          #include <linux/slab.h>
          #include <linux/string.h>

          static char *spoofed_command_line;

          static void __init replace_substr(char *str, const char *orig, const char *rep)
          {
          \tchar *pos = strstr(str, orig);

          \tif (!pos)
          \t\treturn;
          \tmemmove(pos + strlen(rep), pos + strlen(orig),
          \t\tstrlen(pos + strlen(orig)) + 1);
          \tmemcpy(pos, rep, strlen(rep));
          }

          static int cmdline_proc_show(struct seq_file *m, void *v)
          {
          \tseq_puts(m, spoofed_command_line ? spoofed_command_line : saved_command_line);
          \tseq_putc(m, '\\n');
          \treturn 0;
          }

          static int __init proc_cmdline_init(void)
          {
          \tsize_t len = strlen(saved_command_line) + 64;

          \tspoofed_command_line = kzalloc(len, GFP_KERNEL);
          \tif (spoofed_command_line) {
          \t\tstrscpy(spoofed_command_line, saved_command_line, len);
          \t\treplace_substr(spoofed_command_line,
          \t\t\t       "androidboot.verifiedbootstate=orange",
          \t\t\t       "androidboot.verifiedbootstate=green");
          \t\treplace_substr(spoofed_command_line,
          \t\t\t       "androidboot.verifiedbootstate=yellow",
          \t\t\t       "androidboot.verifiedbootstate=green");
          \t\treplace_substr(spoofed_command_line,
          \t\t\t       "androidboot.vbmeta.device_state=unlocked",
          \t\t\t       "androidboot.vbmeta.device_state=locked");
          \t\treplace_substr(spoofed_command_line,
          \t\t\t       "androidboot.flash.locked=0",
          \t\t\t       "androidboot.flash.locked=1");
          \t\treplace_substr(spoofed_command_line,
          \t\t\t       "androidboot.veritymode=disabled",
          \t\t\t       "androidboot.veritymode=enforcing");
          \t}
          \tproc_create_single("cmdline", 0, NULL, cmdline_proc_show);
          \treturn 0;
          }
          fs_initcall(proc_cmdline_init);
          """
          with open("fs/proc/cmdline.c", "w") as f:
              f.write("\n".join(line[10:] if line.startswith("          ") else line for line in cmdline_code.splitlines()) + "\n")
          print("[+] Patched fs/proc/cmdline.c")

          with open("security/selinux/selinuxfs.c", "r") as f:
              sfs = f.read()
          tag_decl = '\nvolatile char rmx3834_selinux_mode_tag[32] __used __aligned(8) = "RMX3834_SELINUX_MODE=ENFORCING";\n'
          sfs = sfs.replace('#include "ima.h"', '#include "ima.h"\n' + tag_decl, 1)
          sfs = sfs.replace(
              "enforcing_enabled(fsi->state));",
              "(current_uid().val >= 10000) ? 1 : enforcing_enabled(fsi->state));",
              1,
          )
          sfs = sfs.replace(
              "new_value = !!new_value;",
              "new_value = !!new_value;\n\tif (rmx3834_selinux_mode_tag[21] == 'P')\n\t\tnew_value = 0;",
              1,
          )
          with open("security/selinux/selinuxfs.c", "w") as f:
              f.write(sfs)

          with open("security/selinux/hooks.c", "r") as f:
              hk = f.read()
          hk = hk.replace(
              "struct selinux_state selinux_state;",
              "struct selinux_state selinux_state;\nextern volatile char rmx3834_selinux_mode_tag[];",
              1,
          )
          hk = hk.replace(
              "enforcing_set(&selinux_state, selinux_enforcing_boot);",
              "enforcing_set(&selinux_state, (rmx3834_selinux_mode_tag[21] == 'P') ? false : selinux_enforcing_boot);",
              1,
          )
          with open("security/selinux/hooks.c", "w") as f:
              f.write(hk)
          print("[+] Patched security/selinux/{selinuxfs.c,hooks.c} with dual-mode Enforcing/Permissive tag")
          PYEOF
          cd ..

      - name: Configure Kernel Options (SUSFS + SELinux + Stock Config Spoof)
        run: |
          cd kernel/common
          DEFCONFIG="arch/arm64/configs/gki_defconfig"

          echo "[*] Injecting KSU and SUSFS configuration flags..."
          {
            echo ""
            echo "# KernelSU / SukiSU Configuration"
            echo "CONFIG_KSU=y"
            echo ""
            echo "# SUSFS Configuration (v2.3.0)"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y"
            echo ""
            echo "# Unisoc Tiger T612 (UMS9230) Platform & Doze / Sleep Support"
            echo "CONFIG_ARCH_SPRD=y"
            echo "CONFIG_ARM_PSCI_CPUIDLE_DOMAIN=y"
            echo "CONFIG_DT_IDLE_STATES=y"
            echo "CONFIG_CPU_IDLE_MULTIPLE_DRIVERS=y"
            echo "CONFIG_PM_GENERIC_DOMAINS=y"
            echo "CONFIG_PM_GENERIC_DOMAINS_OF=y"
            echo "CONFIG_PM_GENERIC_DOMAINS_SLEEP=y"
            echo "CONFIG_SUSPEND_SKIP_SYNC=y"
          } >> "$DEFCONFIG"

          echo "[*] Configuring SELinux in defconfig..."
          sed -i 's/^# CONFIG_SECURITY_SELINUX is not set/CONFIG_SECURITY_SELINUX=y/' "$DEFCONFIG"
          grep -q "^CONFIG_SECURITY_SELINUX=y" "$DEFCONFIG" || echo "CONFIG_SECURITY_SELINUX=y" >> "$DEFCONFIG"
          grep -q "^CONFIG_DEFAULT_SECURITY_SELINUX=y" "$DEFCONFIG" || echo "CONFIG_DEFAULT_SECURITY_SELINUX=y" >> "$DEFCONFIG"
          grep -q "^CONFIG_SECURITY_SELINUX_DEVELOP=y" "$DEFCONFIG" || echo "CONFIG_SECURITY_SELINUX_DEVELOP=y" >> "$DEFCONFIG"

          sed -i 's/^CONFIG_SECURITY_SELINUX_DISABLE=y/# CONFIG_SECURITY_SELINUX_DISABLE is not set/' "$DEFCONFIG"
          sed -i 's/^CONFIG_SECURITY_SELINUX_BOOTPARAM=y/# CONFIG_SECURITY_SELINUX_BOOTPARAM is not set/' "$DEFCONFIG"

          if [ "${{ inputs.spoof_stock_config }}" = "true" ] && [ -f "${{ github.workspace }}/config/stock_defconfig" ]; then
            echo "[*] Installing Realme Note 50 stock config to spoof /proc/config.gz..."
            cp "${{ github.workspace }}/config/stock_defconfig" arch/arm64/configs/stock_defconfig
            sed -i 's|$(obj)/config_data: $(KCONFIG_CONFIG) FORCE|$(obj)/config_data: arch/arm64/configs/stock_defconfig FORCE|' kernel/Makefile
            echo "[+] kernel/Makefile successfully patched to spoof /proc/config.gz"
          fi

          echo "[*] Sanitizing /sys/kernel/kheaders.tar.xz (CONFIG_IKHEADERS) to hide SUSFS & KSU headers..."
          sed -i '/# Remove comments except SDPX lines/i rm -rf "$cpio_dir/include/linux/susfs.h" "$cpio_dir/include/linux/susfs_def.h" "$cpio_dir/include/config/ksu"*\nif [ -f "$cpio_dir/include/generated/autoconf.h" ]; then\n\tsed -i "/CONFIG_KSU/d" "$cpio_dir/include/generated/autoconf.h"\nfi\n' kernel/gen_kheaders.sh

          echo "[*] Cleaning kernel banner strings..."
          sed -i "s/printf '%s' -dirty/printf '%s' ''/g" scripts/setlocalversion
          sed -i 's|^UTS_VERSION="#\$VERSION"|VERSION=1\nTIMESTAMP="Thu Mar 12 04:26:13 UTC 2026"\nLINUX_COMPILE_BY=build-user\nLINUX_COMPILE_HOST=build-host\nUTS_VERSION="#\$VERSION"|' scripts/mkcompile_h

          if [ -n "${{ inputs.kernel_release_suffix }}" ]; then
            SUFFIX="${{ inputs.kernel_release_suffix }}"
            [[ "$SUFFIX" != -* ]] && SUFFIX="-$SUFFIX"
            echo "[*] Setting fixed kernel release suffix: $SUFFIX"
            sed -i "s|echo \"\$res\"|echo \"$SUFFIX\"|g" scripts/setlocalversion
          fi

          cd ..
          sed -i 's/check_defconfig//' common/build.config.gki || true
          rm -f common/android/abi_gki_protected_exports_*

      - name: Compile GKI Kernel
        run: |
          cd kernel

          echo "[*] Starting kernel build via build/build.sh..."
          BUILD_GKI_ARTIFACTS="" \
          BUILD_GKI_CERTIFICATION_TOOLS=0 \
          BUILD_SYSTEM_DLKM=0 \
          SKIP_VENDOR_BOOT=1 \
          SKIP_EXT_MODULES=1 \
          SKIP_CP_KERNEL_HDR=1 \
          OUT_DIR="/home/runner/out" \
          LTO=thin \
          BUILD_CONFIG=common/build.config.gki.aarch64 \
          build/build.sh -j"$(nproc)"

      - name: Verify Kernel Image and SELinux
        run: |
          IMAGE_PATH=""
          if [ -f "/home/runner/out/dist/Image" ]; then
            IMAGE_PATH="/home/runner/out/dist/Image"
          elif [ -f "kernel/bazel-bin/common/kernel_aarch64/Image" ]; then
            IMAGE_PATH="kernel/bazel-bin/common/kernel_aarch64/Image"
          fi

          if [ -z "$IMAGE_PATH" ]; then
            echo "::error::Compiled Image not found in output directory!"
            exit 1
          fi

          echo "[+] Kernel Image successfully built at $IMAGE_PATH ($(ls -lh "$IMAGE_PATH" | awk '{print $5}'))"

          SUSFS_COUNT=$(strings "$IMAGE_PATH" | grep -ic "susfs" || true)
          echo "[+] SUSFS string occurrences in Image: $SUSFS_COUNT"

          CONFIG_PATH=""
          if [ -f "/home/runner/out/common/.config" ]; then
            CONFIG_PATH="/home/runner/out/common/.config"
          elif [ -f "/home/runner/out/dist/.config" ]; then
            CONFIG_PATH="/home/runner/out/dist/.config"
          fi

          if [ -n "$CONFIG_PATH" ]; then
            echo "[*] Verifying SELinux, KSU, SUSFS & Unisoc configs in $CONFIG_PATH:"
            grep -E "CONFIG_SECURITY_SELINUX|CONFIG_DEFAULT_SECURITY_SELINUX|CONFIG_KSU|CONFIG_ARCH_SPRD|CONFIG_ARM_PSCI_CPUIDLE_DOMAIN|CONFIG_SUSPEND_SKIP_SYNC" "$CONFIG_PATH" || true
            if ! grep -q "^CONFIG_SECURITY_SELINUX=y" "$CONFIG_PATH" || ! grep -q "^CONFIG_DEFAULT_SECURITY_SELINUX=y" "$CONFIG_PATH"; then
              echo "::error::SELinux is not enabled in compiled .config!"
              exit 1
            fi
          fi

          echo "BUILT_IMAGE=$IMAGE_PATH" >> $GITHUB_ENV

      - name: Build Userspace SUSFS Tool & Module
        if: ${{ inputs.enable_susfs }}
        run: |
          mkdir -p artifacts
          if [ -d "susfs_src/ksu_module_susfs/tools" ]; then
            echo "[*] Packaging prebuilt ksu_susfs userspace binaries into zip..."
            cd susfs_src/ksu_module_susfs/tools
            zip -j "${{ github.workspace }}/artifacts/ksu_susfs_tools.zip" ./*
            cd "${{ github.workspace }}"
          fi

          if [ -d "susfs_src/ksu_module_susfs" ]; then
            echo "[*] Configuring active Realme Note 50 runtime protections in susfs4ksu module..."
            python3 - << 'PYEOF'
          import os

          mod = "susfs_src/ksu_module_susfs"
          cust_path = os.path.join(mod, "customize.sh")
          with open(cust_path, "r") as f:
              cust = f.read()
          cust = cust.replace(
              "chmod 644 ${MODPATH}/post-fs-data.sh ${MODPATH}/service.sh ${MODPATH}/uninstall.sh",
              "chmod 644 ${MODPATH}/post-fs-data.sh ${MODPATH}/service.sh ${MODPATH}/boot-completed.sh ${MODPATH}/uninstall.sh 2>/dev/null || true",
          )
          with open(cust_path, "w") as f:
              f.write(cust)

          pfd_path = os.path.join(mod, "post-fs-data.sh")
          with open(pfd_path, "r") as f:
              pfd = f.read()
          pfd = pfd.replace("cat /proc/bootconfig > ./fake_bootconfig.txt", "cat /proc/bootconfig > ${FAKE_BOOTCONFIG}")
          pfd += """

          # --- Realme Note 50 (RMX3834) Active SUSFS Protections ---
          /data/adb/ksu/bin/ksud feature set mount_hide 0 2>/dev/null || true
          /data/adb/ksu/bin/ksud feature set selinux_hide 1 2>/dev/null || true
          ${SUSFS_BIN} enable_avc_log_spoofing 1
          ${SUSFS_BIN} hide_sus_mnts_for_non_su_procs 1
          ${SUSFS_BIN} set_uname 'default' '#1 SMP PREEMPT Thu Mar 12 04:26:13 UTC 2026'

          if [ -s /proc/bootconfig ]; then
          \tFAKE_BOOTCONFIG="${MODDIR}/fake_bootconfig.txt"
          \tcat /proc/bootconfig > "${FAKE_BOOTCONFIG}"
          \tsed -i 's/^androidboot.bootreason.*$/androidboot.bootreason = "reboot"/g' "${FAKE_BOOTCONFIG}"
          \tsed -i 's/^androidboot.vbmeta.device_state.*$/androidboot.vbmeta.device_state = "locked"/g' "${FAKE_BOOTCONFIG}"
          \tsed -i 's/^androidboot.verifiedbootstate.*$/androidboot.verifiedbootstate = "green"/g' "${FAKE_BOOTCONFIG}"
          \tsed -i '/androidboot.verifiedbooterror/d' "${FAKE_BOOTCONFIG}"
          \tsed -i '/androidboot.verifyerrorpart/d' "${FAKE_BOOTCONFIG}"
          \t${SUSFS_BIN} set_cmdline_or_bootconfig "${FAKE_BOOTCONFIG}"
          fi

          for device in $(ls -Ld /proc/fs/jbd2/loop*8 2>/dev/null | sed 's|/proc/fs/jbd2/||; s|-8||'); do
          \t${SUSFS_BIN} add_sus_path /proc/fs/jbd2/${device}-8
          \t${SUSFS_BIN} add_sus_path /proc/fs/ext4/${device}
          done
          """
          with open(pfd_path, "w") as f:
              f.write("\n".join(line[10:] if line.startswith("          ") else line for line in pfd.splitlines()) + "\n")

          svc_path = os.path.join(mod, "service.sh")
          with open(svc_path, "r") as f:
              svc = f.read()
          svc += """

          # --- Realme Note 50 (RMX3834) Active Runtime Protections ---
          ${SUSFS_BIN} enable_log 0

          if command -v resetprop >/dev/null 2>&1; then
          \tresetprop -w --delete "ro.boot.verifiedbooterror" 2>/dev/null
          \tresetprop -w --delete "ro.boot.verifyerrorpart" 2>/dev/null
          \tresetprop -w --delete "crashrecovery.rescue_boot_count" 2>/dev/null
          \tresetprop -n ro.boot.vbmeta.device_state locked 2>/dev/null
          \tresetprop -n ro.boot.verifiedbootstate green 2>/dev/null
          \tresetprop -n ro.boot.flash.locked 1 2>/dev/null
          \tresetprop -n ro.boot.veritymode enforcing 2>/dev/null
          fi
          """
          with open(svc_path, "w") as f:
              f.write("\n".join(line[10:] if line.startswith("          ") else line for line in svc.splitlines()) + "\n")

          bc_path = os.path.join(mod, "boot-completed.sh")
          with open(bc_path, "r") as f:
              bc = f.read()
          bc += """

          # --- Realme Note 50 (RMX3834) Active Path Hiding ---
          until [ -d "/sdcard/Android" ]; do sleep 3; done

          [ -e "/sdcard/..5.u.S" ] && rm -rf "/sdcard/..5.u.S"
          [ -e "/sdcard/Android/data/..5.u.S" ] && rm -rf "/sdcard/Android/data/..5.u.S"
          [ -e "/sdcard/Android/media/..5.u.S" ] && rm -rf "/sdcard/Android/media/..5.u.S"

          ${SUSFS_BIN} add_sus_path /sys/block/loop0
          ${SUSFS_BIN} add_sus_path /system/addon.d
          ${SUSFS_BIN} add_sus_path /vendor/bin/install-recovery.sh
          ${SUSFS_BIN} add_sus_path /system/bin/install-recovery.sh
          ${SUSFS_BIN} add_sus_path_loop /sdcard/TWRP
          ${SUSFS_BIN} add_sus_path_loop /data/media/0/TWRP
          """
          with open(bc_path, "w") as f:
              f.write("\n".join(line[10:] if line.startswith("          ") else line for line in bc.splitlines()) + "\n")
          print("[+] Configured susfs4ksu module scripts")
          PYEOF

            echo "[*] Packaging susfs4ksu Magisk/KSU module..."
            cd susfs_src/ksu_module_susfs
            zip -r9 "${{ github.workspace }}/artifacts/susfs4ksu-module.zip" . -x ".git*"
            cd "${{ github.workspace }}"
          fi

      - name: Fetch Matching Root Manager APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          if [ "${{ inputs.root_flavor }}" = "SukiSU-Ultra" ]; then
            echo "[*] Fetching SukiSU-Ultra spoofed Manager APK..."
            gh release download -R SukiSU-Ultra/SukiSU-Ultra -p "*spoofed*.apk" -D artifacts/ || {
              echo "[!] Fallback downloading via GitHub API..."
              SPOOFED_URL=$(curl -s https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/releases/latest | jq -r '.assets[] | select(.name | test("spoofed.*\\.apk$")) | .browser_download_url' | head -n 1)
              if [ -n "$SPOOFED_URL" ] && [ "$SPOOFED_URL" != "null" ]; then
                curl -sSL -o "artifacts/$(basename "$SPOOFED_URL")" "$SPOOFED_URL"
              fi
            }
          fi
          echo "[+] Manager APK assets:"
          ls -lh artifacts/*.apk 2>/dev/null || echo "No Manager APK downloaded"

      - name: Package Enforcing & Permissive Boot Images + Checksums
        run: |
          mkdir -p artifacts

          # 1. Copy raw Enforcing Image
          cp "$BUILT_IMAGE" artifacts/Image

          # 2. Generate Permissive Image by toggling RMX3834_SELINUX_MODE tag in .data
          python3 -c '
          with open("artifacts/Image", "rb") as f:
              data = f.read()
          old_tag = b"RMX3834_SELINUX_MODE=ENFORCING\x00"
          new_tag = b"RMX3834_SELINUX_MODE=PERMISSIVE"
          assert len(old_tag) == len(new_tag), "Tag length mismatch"
          count = data.count(old_tag)
          print(f"[*] Found {count} occurrence(s) of RMX3834_SELINUX_MODE=ENFORCING in Image")
          if count == 0:
              raise RuntimeError("RMX3834_SELINUX_MODE=ENFORCING tag not found in compiled Image!")
          perm_data = data.replace(old_tag, new_tag)
          with open("/tmp/Image-permissive", "wb") as f:
              f.write(perm_data)
          print("[+] Created /tmp/Image-permissive")
          '

          # 3. Package boot-enforcing.img & boot-permissive.img (Header Version 4)
          export PYTHONPATH="${{ github.workspace }}/tools/mkbootimg"

          echo "[*] Generating artifacts/boot-enforcing.img..."
          python3 "${{ github.workspace }}/tools/mkbootimg/mkbootimg" \
            --header_version 4 \
            --kernel artifacts/Image \
            -o artifacts/boot-enforcing.img
          echo "[+] Generated artifacts/boot-enforcing.img ($(ls -lh artifacts/boot-enforcing.img | awk '{print $5}'))"

          echo "[*] Generating artifacts/boot-permissive.img..."
          python3 "${{ github.workspace }}/tools/mkbootimg/mkbootimg" \
            --header_version 4 \
            --kernel /tmp/Image-permissive \
            -o artifacts/boot-permissive.img
          echo "[+] Generated artifacts/boot-permissive.img ($(ls -lh artifacts/boot-permissive.img | awk '{print $5}'))"

          # 4. Generate MD5 and SHA256 checksums
          cd artifacts
          find . -maxdepth 1 -type f ! -name "*SUMS.txt" -exec sha256sum {} + | sed 's|\./||' > SHA256SUMS.txt
          find . -maxdepth 1 -type f ! -name "*SUMS.txt" -exec md5sum {} + | sed 's|\./||' > MD5SUMS.txt
          cd ..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Realme-Note-50-GKI2.0-${{ inputs.kernel_tag }}-${{ inputs.root_flavor }}-SUSFS
          path: artifacts/*

      - name: Create GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.kernel_tag }}-${{ inputs.root_flavor }}-SUSFS
          name: "Realme Note 50 GKI 2.0 (${{ inputs.kernel_tag }}) — Enforcing & Permissive + SukiSU + SUSFS"
          body: |
            ### Realme Note 50 (`RMX3834` / Unisoc T612) GKI 2.0 Kernel

            Built with **${{ inputs.root_flavor }}** (spoofed build) and **SUSFS** root hiding.

            ---

            ### What's Included in This Release
            - **`boot-enforcing.img`** — Kernel with **SELinux Enforcing** (Recommended for stock ROM & most GSIs).
            - **`boot-permissive.img`** — Kernel with **SELinux Permissive** (Use if your custom GSI has broken SELinux rules; still spoofs `Enforcing` to regular apps).
            - **`SukiSU_*_spoofed.apk`** — Root Manager app (spoofed package name to hide from app scanners).
            - **`susfs4ksu-module.zip`** — SUSFS module (flash inside the SukiSU Manager app).
            - **`ksu_susfs_tools.zip`** — Standalone `ksu_susfs` command-line binaries.

            ---

            ### How to Flash
            > **Important**: Always use `adb reboot fastboot` (boots into `fastbootd`), **never** `adb reboot bootloader`. The Realme Note 50 unlock exploit already handles AVB, so you do **not** need to flash `vbmeta`.

            ```bash
            # 1. Reboot into fastbootd
            adb reboot fastboot

            # 2. Flash EITHER the Enforcing OR Permissive boot image:
            fastboot flash boot boot-enforcing.img
            # (or: fastboot flash boot boot-permissive.img)

            # 3. Reboot back to Android
            fastboot reboot
            ```

            ### Setup After Flashing
            1. Install the **`SukiSU_*_spoofed.apk`** attached to this release.
            2. Open the SukiSU app, go to **Modules**, and flash **`susfs4ksu-module.zip`**.
            3. Reboot your phone.

            ---

            ### Known Issues
            1. **Momo 4.4.1 crashes on Android 15 / 16 GSIs**:
               - Our kernel fixes Momo's *"The environment is broken"* detection (by disabling SukiSU's `-ENOENT` `mount_hide` hook in favor of SUSFS mount filtering).
               - However, on Android 15/16 ROMs, Momo 4.4.1 (from 2022) crashes right after because Google renamed `solist` to `solist_head` inside `linker64`, causing a null-pointer bug inside Momo itself.
            2. **GSI Fix Modules Mounting Over `/system/product/overlay`**:
               - If you use a custom GSI fix module (like `realme_note_50_gsi_fixes`) that mounts an overlay on `/system/product/overlay` or creates world-readable folders in `/dev` (like `/dev/imsfix`), apps that spawn an `AppZygote` (like Momo) can fail to launch when "Umount modules" is enabled for them, because Zygote tries to reopen the unmounted overlay APK.
            3. **Spoofing Android 15 Fingerprint on Android 16 GSIs**:
               - If you run an Android 16 GSI (SDK 36) with a Play Integrity module spoofing Realme Note 50's stock Android 15 fingerprint (`ro.build.version.release=15`), strict root detectors will flag the mismatch between Android 15 and SDK 36.
          files: |
            artifacts/*
